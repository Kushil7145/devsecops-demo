name: DevSecOps-Pipeline

on:
    push: 
     branches: [main, feature/*]
    pull_request:
permissions:
  pull-requests: write # allows SonarQube to decorate PRs with analysis results
  contents: read
  security-events: write

jobs:
  devsecops-Build-CI:
    name: Build & Scan
    runs-on: self-hosted
    container:
      image: node:22-bullseye

    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        # -------------------------
        # SECRETS SCANNING - TRUFFLEHOG
        # -------------------------

        - name: Secrets Scan (TruffleHog)
          run: |
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh
            ./bin/trufflehog git file://. --since-commit ${{ github.event.before }} --branch ${{ github.sha }} --fail
                
        # -------------------------
        # SAST - SonarQube
        # -------------------------

        - name: Analyze with SonarQube
          uses: SonarSource/sonarqube-scan-action@v7.0.0
          env:
           GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}  # Needed to get PR information
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
           SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL (Settings > Secrets > Actions > add new repository secret)
          with:
           args:
            -Dsonar.projectKey=devsecops-demo
            -Dsonar.sources=.
        
        # -------------------------
        # Build
        # -------------------------
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
      
        - name: Install dependencies
          run: npm ci
      
        - name: Build project
          run: npm run build
      
        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: build-artifacts
            path: dist/
        
  devsecops-Docker-CI:
    name: Docker Build and Push
    runs-on: self-hosted
    needs: [devsecops-Build-CI]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    outputs:
      image_tag: ${{ steps.set_output.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Set image tag output
        id: set_output
        run: echo "image_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT


        
      
