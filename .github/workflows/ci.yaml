name: DevSecOps-Pipeline

on:
    push: 
     branches: [main, feature/*]
    pull_request:

jobs:
  build:
    name: Build Application
    runs-on: self-hosted
    container:
      image: node:22-bullseye
    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Install dependencies
          run: npm ci

        - name: Build project
          run: npm run build



